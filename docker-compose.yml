# Local development only: Postgres + DbGate. The apps run on the host via `pnpm dev`.
# See AGENTS.md section 2 - production deployment manifests are out of scope.
name: make-your-case

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: makeyourcase
      POSTGRES_PASSWORD: makeyourcase
      POSTGRES_DB: makeyourcase
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql; it stores
      # data in a major-version subdirectory beneath it.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U makeyourcase -d makeyourcase']
      interval: 5s
      timeout: 5s
      retries: 10

  dbgate:
    image: dbgate/dbgate:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host port 3100 to avoid clashing with `pnpm dev` (often on 3000).
      - '3100:3000'
    environment:
      # DbGate web UI login (local dev only).
      LOGIN: makeyourcase
      PASSWORD: makeyourcase

      # Preconfigured connection to the postgres service.
      CONNECTIONS: pg
      LABEL_pg: make-your-case (local)
      ENGINE_pg: postgres@dbgate-plugin-postgres
      SERVER_pg: postgres
      PORT_pg: 5432
      USER_pg: makeyourcase
      PASSWORD_pg: makeyourcase
      DATABASE_pg: makeyourcase
    volumes:
      # Persists saved queries, settings, etc.
      - dbgate-data:/root/.dbgate

volumes:
  pgdata:
  dbgate-data:
