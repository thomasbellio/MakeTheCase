id: 08-bald-assertion
purpose: >
  A load-bearing factual claim offered with no support and no citation,
  surrounded by facts that are properly cited.
expected_status: completed
thesis: The Board should grant the Hendersons' setback variance
hard:
  findings_present:
    - kind: unsupported_claim
      severity: warning
    - kind: load_bearing
  findings_absent:
    - circularity
    - invalid_step
  unsupported_claim_count: { min: 1, max: 1 }
  claim_count: { min: 6, max: 11 }
soft:
  key_claims:
    - Section 9.4 permits a variance for a practical difficulty unique to the property and not created by the owner
    - The rear half of the lot slopes at 30 percent (survey)
    - An addition within the setback would require retaining walls costing more than the addition (architect)
    - 'Unsupported: no other lot on Ridgeway Lane has a comparable slope'
    - The slope predates the Hendersons' 2015 purchase (plat, deed)
  unsupported_claim: >
    Exactly one unsupported_claim, on "no other lot on Ridgeway Lane has a
    comparable slope". It carries the uniqueness element by itself, so it
    must also be load-bearing. Every other factual claim cites the record
    and must not be flagged.
notes: >
  Depends on the planned citation-aware unsupported_claim rule (citations
  allowed on factual claims; only uncited load-bearing facts are flagged).
  Under the current rule every fact here would be flagged.
